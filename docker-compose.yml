services:
  awface-db:
    image: postgres:16-alpine
    container_name: awface-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-awface}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-assinaweb}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-awface}"]
      interval: 10s
      timeout: 5s
      retries: 10

  awface-api:
    build:
      context: .
      dockerfile: backend/AWFace.Api/Dockerfile
    container_name: awface-api
    restart: unless-stopped
    depends_on:
      awface-db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      TZ: "${TZ:-America/Sao_Paulo}"
      ConnectionStrings__Awface: "Host=awface-db;Port=5432;Database=${POSTGRES_DB:-awface};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-assinaweb};Search Path=public;Include Error Detail=true"
      Awface__Schema: "public"
      Awface__FrontendBaseUrl: "${AWFACE_FRONTEND_BASE_URL:-http://localhost:8080}"
      Awface__LivenessAppkeyLifetimeMinutes: "${AWFACE_LIVENESS_APPKEY_LIFETIME_MINUTES:-20}"
      Awface__LivenessEngine: "${AWFACE_LIVENESS_ENGINE:-V10}"
      Awface__FaceStorage__RootPath: "${AWFACE_FACE_STORAGE_ROOT_PATH:-/app/storage/faces}"
      Awface__FaceStorage__EncryptionKey: "${AWFACE_FACE_STORAGE_ENCRYPTION_KEY:-troque-esta-chave-em-producao}"
      Awface__Admin__Email: "${AWFACE_ADMIN_EMAIL:-admin@awface.local}"
      Awface__Admin__Password: "${AWFACE_ADMIN_PASSWORD:-Awface@123}"
      Awface__Cors__AllowedOrigins__0: "${AWFACE_FRONTEND_BASE_URL:-http://localhost:8080}"
      Certiface__BaseUrl: "${CERTIFACE_BASE_URL:-https://hml.certiface.com.br}"
      Certiface__ResultBaseUrl: "${CERTIFACE_RESULT_BASE_URL:-https://hml.certiface.com.br:8443}"
      Logging__File__Enabled: "true"
      Logging__File__Directory: logs
    ports:
      - "${AWFACE_API_PORT:-5000}:8080"
    volumes:
      - ./docker-data/api-logs:/app/logs
      - ./docker-data/awface-storage:/app/storage

  awface-front:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: awface-front
    restart: unless-stopped
    depends_on:
      - awface-api
    ports:
      - "${AWFACE_FRONT_PORT:-8080}:80"
