<main class="admin-shell">
  <section class="login-panel">
    <a routerLink="/journey-start" class="back-link">Voltar para jornada</a>
    <p class="eyebrow">AWFace Master</p>
    <h1>Acesso administrativo</h1>
    <p>Entre para configurar tenants, credenciais, callback e identidade visual.</p>

    <form (ngSubmit)="login()" class="admin-form">
      <div>
        <label class="form-label" for="adminEmail">Email</label>
        <input id="adminEmail" class="form-control" name="email" type="email" [(ngModel)]="email" autocomplete="username" />
      </div>

      <div>
        <label class="form-label" for="adminPassword">Senha</label>
        <input id="adminPassword" class="form-control" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" />
      </div>

      <p class="error-message" *ngIf="error">{{ error }}</p>

      <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
    <small class="release-version">AWFace v{{ awfaceVersion }}</small>
  </section>
</main>
