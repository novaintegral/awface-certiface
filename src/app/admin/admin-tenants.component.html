<main class="admin-shell admin-workspace">
  <header class="admin-header">
    <div>
      <p class="eyebrow">AWFace Master</p>
      <h1>Tenants e whitelabel</h1>
    </div>
    <div class="header-actions">
      <a routerLink="/journey-start">Jornada</a>
      <button type="button" class="ghost-button" (click)="logout()">Sair</button>
    </div>
  </header>

  <section class="tenant-layout">
    <aside class="tenant-list">
      <button type="button" class="new-button" (click)="newTenant()">Novo tenant</button>
      <button
        type="button"
        class="tenant-item"
        *ngFor="let tenant of tenants"
        [class.selected]="tenant.id === selectedTenant.id"
        (click)="selectTenant(tenant)"
      >
        <strong>{{ tenant.name }}</strong>
        <span>{{ statusLabel(tenant.status) }}</span>
        <small>{{ tenant.integrationToken }}</small>
      </button>
    </aside>

    <form class="tenant-editor" (ngSubmit)="saveTenant()">
      <div class="editor-title">
        <div>
          <h2>{{ selectedTenant.id ? 'Editar tenant' : 'Novo tenant' }}</h2>
          <p>Configure a identidade visual, callbacks e credenciais Certiface por tipo de jornada.</p>
        </div>
        <span class="status-pill">{{ statusLabel(selectedTenant.status) }}</span>
      </div>

      <div class="form-grid">
        <label>
          Nome do tenant
          <input name="name" [(ngModel)]="selectedTenant.name" required />
        </label>

        <label>
          Token de integração
          <span class="token-field">
            <input name="integrationToken" [(ngModel)]="selectedTenant.integrationToken" autocomplete="off" />
            <button
              type="button"
              class="icon-button token-action"
              aria-label="Regenerar token de integração"
              title="Regenerar token de integração"
              (click)="regenerateIntegrationToken()"
            >
              ↻
            </button>
            <button
              type="button"
              class="icon-button token-action"
              aria-label="Copiar token de integração"
              title="Copiar token de integração"
              (click)="copyIntegrationToken()"
            >
              ⧉
            </button>
          </span>
        </label>

        <label>
          Termos de uso
          <input name="termsUrl" [(ngModel)]="selectedTenant.termsUrl" type="url" />
        </label>

        <label>
          Política de privacidade
          <input name="privacyUrl" [(ngModel)]="selectedTenant.privacyUrl" type="url" />
        </label>

        <label>
          Tema da jornada
          <select name="theme" [(ngModel)]="selectedTenant.theme">
            <option value="LIGHT">Claro</option>
            <option value="DARK">Escuro</option>
          </select>
        </label>

        <label>
          Cor principal
          <span class="color-field">
            <input name="primaryColorPicker" [(ngModel)]="selectedTenant.primaryColor" type="color" />
            <input name="primaryColor" [(ngModel)]="selectedTenant.primaryColor" autocomplete="off" />
          </span>
        </label>

        <label>
          Cor secundária
          <span class="color-field">
            <input name="secondaryColorPicker" [(ngModel)]="selectedTenant.secondaryColor" type="color" />
            <input name="secondaryColor" [(ngModel)]="selectedTenant.secondaryColor" autocomplete="off" />
          </span>
        </label>

        <label>
          UrlCallback
          <input name="callbackUrl" [(ngModel)]="selectedTenant.callbackUrl" type="url" />
        </label>

        <label>
          SecureCallback
          <input name="secureCallbackToken" [(ngModel)]="selectedTenant.secureCallbackToken" autocomplete="off" />
        </label>

        <label class="full-line">
          Logotipo do tenant
          <input name="logoFile" type="file" accept="image/*" (change)="onLogoFileSelected($event)" />
        </label>

        <div class="logo-preview full-line" *ngIf="selectedTenant.logoBase64">
          <span>Prévia do logotipo</span>
          <img [src]="getLogoPreview()" [alt]="selectedTenant.name || 'Logotipo do tenant'" />
        </div>
      </div>

      <section class="credentials-section">
        <h3>Jornadas habilitadas</h3>
        <div class="credential-card" *ngFor="let journey of journeyTypes">
          <label class="check-row">
            <input
              type="checkbox"
              [checked]="hasCredential(journey.value)"
              (change)="toggleCredential(journey.value, $any($event.target).checked)"
            />
            {{ journey.label }}
          </label>

          <div class="credential-fields" *ngIf="hasCredential(journey.value)">
            <label>
              Usuário Certiface
              <input
                [name]="'providerUser' + journey.value"
                [(ngModel)]="getCredential(journey.value).providerUser"
                autocomplete="off"
              />
            </label>
            <label>
              Senha Certiface
              <input
                [name]="'providerPass' + journey.value"
                [(ngModel)]="getCredential(journey.value).providerPass"
                autocomplete="off"
              />
            </label>
          </div>
        </div>
      </section>

      <p class="success-message" *ngIf="message">{{ message }}</p>

      <div class="editor-actions">
        <button type="submit">Salvar tenant</button>
        <button type="button" class="ghost-button" (click)="setStatus('ACTIVE')" [disabled]="!selectedTenant.id">Ativar</button>
        <button type="button" class="ghost-button" (click)="setStatus('BLOCKED')" [disabled]="!selectedTenant.id">Bloquear</button>
        <button type="button" class="danger-button" (click)="setStatus('CANCELLED')" [disabled]="!selectedTenant.id">Cancelar</button>
      </div>
    </form>
  </section>
</main>
