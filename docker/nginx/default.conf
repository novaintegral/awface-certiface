server {
    listen 5580;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 25m;

    # Cabeçalhos de segurança (repetidos nas locations que definem add_header próprio,
    # pois o Nginx não herda add_header do server nesses casos).
    include /etc/nginx/snippets/awface-security-headers.conf;

    location ^~ /api/ {
        proxy_pass http://awface-api:5500;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://awface-api:5500/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Service workers: sempre revalidados, para que o "kill switch" chegue aos navegadores.
    location ~ ^/(ngsw-worker|safety-worker|worker-basic\.min)\.js$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
        include /etc/nginx/snippets/awface-security-headers.conf;
        try_files $uri =404;
    }

    # Manifesto do service worker antigo: 404 faz o worker legado se desativar.
    location = /ngsw.json {
        return 404;
    }

    # Arquivos estáticos inexistentes retornam 404 em vez do index.html (evita
    # scripts/estilos servidos como HTML quando um cache pede um arquivo antigo).
    location ~* \.(?:js|mjs|css|map|json|wasm|data|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|mp3|txt)$ {
        try_files $uri =404;
    }

    # index.html nunca é cacheado: novas versões chegam aos usuários imediatamente.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/awface-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
